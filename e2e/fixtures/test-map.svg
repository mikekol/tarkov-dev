<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1500 -1500 6000 6000">
  <g id="base">
    <!-- Background: entire map extent -->
    <rect x="-3000" y="-3000" width="6000" height="6000" fill="#1a1a2e"/>
    <!-- Ring: ±600m -->
    <rect x="-600" y="-600" width="1200" height="1200" fill="#1abc9c"/>
    <!-- Ring: ±550m -->
    <rect x="-550" y="-550" width="1100" height="1100" fill="#f39c12"/>
    <!-- Ring: ±500m -->
    <rect x="-500" y="-500" width="1000" height="1000" fill="#c0392b"/>
    <!-- Ring: ±450m -->
    <rect x="-450" y="-450" width="900"  height="900"  fill="#16a085"/>
    <!-- Ring: ±400m -->
    <rect x="-400" y="-400" width="800"  height="800"  fill="#8e44ad"/>
    <!-- Ring: ±350m -->
    <rect x="-350" y="-350" width="700"  height="700"  fill="#2980b9"/>
    <!-- Ring: ±300m -->
    <rect x="-300" y="-300" width="600"  height="600"  fill="#27ae60"/>
    <!-- Ring: ±250m -->
    <rect x="-250" y="-250" width="500"  height="500"  fill="#f5a623"/>
    <!-- Ring: ±200m -->
    <rect x="-200" y="-200" width="400"  height="400"  fill="#e94560"/>
    <!-- Ring: ±150m -->
    <rect x="-150" y="-150" width="300"  height="300"  fill="#533483"/>
    <!-- Ring: ±100m -->
    <rect x="-100" y="-100" width="200"  height="200"  fill="#0f3460"/>
    <!-- Ring: ±50m -->
    <rect x="-50"  y="-50"  width="100"  height="100"  fill="#16213e"/>
    <!-- Center: ±5m -->
    <rect x="-5"   y="-5"   width="10"   height="10"   fill="#ffffff"/>
  </g>
</svg>
